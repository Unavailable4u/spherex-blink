# Deploys web/ to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions". Then push; the link appears in the run summary.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Unit tests (WCS maths, parallax, flag export)
        run: node tests/run.js
      - name: Assemble site (previews and notes stay out of the deploy)
        run: |
          mkdir _site
          cp -r web/. _site/
          rm -rf _site/tiles/*/previews
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
